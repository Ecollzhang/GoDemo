basePath: /
definitions:
  models.GrowthRecord:
    type: object
  models.User:
    type: object
host: localhost:8080
info:
  contact: {}
  description: 这是一个包含用户模块和学生成长记录模块的后端 API 服务
  title: 学生成长管理系统 API
  version: "1.0"
paths:
  /growth/add:
    post:
      consumes:
      - application/json
      description: 录入一条学生的成长轨迹记录
      parameters:
      - description: 成长记录信息
        in: body
        name: record
        required: true
        schema:
          $ref: '#/definitions/models.GrowthRecord'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.GrowthRecord'
      summary: 添加学生成长记录
      tags:
      - 成长记录管理
  /growth/list:
    get:
      description: 查询全部的成长轨迹列表（后续可扩展分页和按学生查询）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.GrowthRecord'
            type: array
      summary: 获取所有学生成长记录
      tags:
      - 成长记录管理
  /user/register:
    post:
      consumes:
      - application/json
      description: 注册一个新账号
      parameters:
      - description: 用户信息
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/models.User'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 教师/管理员注册
      tags:
      - 用户管理
swagger: "2.0"
